# tria_engine/alembic.ini
#
# Root-level Alembic configuration. `script_location` points at the existing
# migration environment (tria_engine/alembic/) and the database URL is NEVER
# hardcoded here: alembic/env.py imports the application engine
# (tria_engine.core.database), which resolves DATABASE_URL / DB_* env vars
# exactly like the running app — so `alembic upgrade head` migrates whatever
# database the app itself would connect to.

[alembic]
script_location = tria_engine/alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally not set: env.py uses the app engine.
# Set a template here is harmless; env.py overrides it at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S